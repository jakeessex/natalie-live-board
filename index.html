<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<title>Natalie live board</title>
<style>
:root{
  --bg:#140e0a;--surface:#1e1510;--raised:#2a1d16;--fg:#f8f0e4;--muted:#c4b3a0;
  --subtle:#8f7d6c;--border:#3a2b22;--line:#2c2018;--accent:#e8b84a;--accent-fg:#1a120c;
  --call:#2ee59a;--call-fg:#062416;--us:#2a3344;--them:#2a2218;--danger:#ff7a6e;
  --booked:#7dffb2;--warn:#ffb45a;--hot:#ff7a3a;--chase:#5cc8ff;
}
html,body{margin:0;background:
  radial-gradient(1200px 500px at 50% -10%, rgba(232,184,74,.18), transparent 55%),
  var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#go,.primary{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#f3cc6a,#e8b84a);color:var(--accent-fg);font-weight:800;font-size:16px;margin-top:12px}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.heat{display:flex;gap:8px;margin-top:12px;overflow:auto;padding-bottom:2px}
.heat button{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--muted);font-weight:750;font-size:13px;white-space:nowrap}
.heat button.on{background:var(--hot);color:#1a0c08;border-color:var(--hot)}
.pep{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#2a1c12,#1a120c);border:1px solid #5a3d20;color:#f3d9a4;font-size:14px;font-weight:650;line-height:1.35}
.badge.quoted{background:#3a2a10;color:#ffd36a}
.badge.price{background:#3a2410;color:#ffb45a}
.badge.chasing{background:#102433;color:#7ad0ff}
.badge.stale{background:#3a1410;color:#ff8a7a}
.badge.today{background:#12301c;color:#7dffb2}
.callbtn{display:flex;align-items:center;justify-content:center;height:52px;margin-top:14px;border-radius:14px;background:linear-gradient(180deg,#4dffb0,#2ee59a);color:var(--call-fg);font-weight:800;text-decoration:none;letter-spacing:.01em;box-shadow:0 8px 20px rgba(46,229,154,.18)}
.days{display:inline-block;margin-top:8px;font-size:12px;font-weight:750;color:var(--warn)}
.days.stale{color:#ff8a7a}
.days.fresh{color:#7dffb2}
.card.hotcard{border-color:#6a4a20;box-shadow:inset 0 0 0 1px rgba(232,184,74,.2)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate.ok{display:none}
.box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px}
.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:22px;margin:0 0 8px;font-weight:600}
.lede{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}
input[type=password],input[type=search],input[type=datetime-local],textarea{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);
  background:var(--raised);color:var(--fg);font-size:16px
}
#go,.primary{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;margin-top:12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0}
#app{display:none}#app.show{display:block}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.96);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tabs button{flex:1 1 calc(25% - 8px);min-width:70px;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:650;font-size:12px}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{padding:14px}
.count{color:var(--subtle);font-size:13px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin:0 0 12px}
.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h2{margin:0;font-size:18px;line-height:1.25;font-weight:650}
.town{margin:4px 0 0;color:var(--muted);font-size:14px}
.badge{flex-shrink:0;border-radius:999px;background:var(--raised);color:var(--muted);font-size:11px;font-weight:700;padding:4px 8px;text-transform:capitalize}
.badge.booked{color:var(--booked)}
.callbtn{display:flex;align-items:center;justify-content:center;height:48px;margin-top:14px;border-radius:12px;background:var(--call);color:var(--call-fg);font-weight:700;text-decoration:none}
.need{margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--raised);color:var(--warn);font-size:14px;font-weight:600}
.email,.replied,.snippet{margin:8px 0 0;font-size:14px;color:var(--muted);word-break:break-word}
.replied{color:var(--fg)}
.calledtag{margin-top:8px;color:var(--booked);font-size:14px;font-weight:650}
.openbtn{width:100%;margin-top:14px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--raised);color:var(--fg);font-weight:650}
#detail{display:none;min-height:100dvh}
#detail.show{display:block}
.back{border:0;background:none;color:var(--muted);font-weight:650;padding:4px 0 8px}
.bubble{margin:10px 0;padding:12px;border:1px solid var(--border);border-radius:14px}
.bubble.us{margin-left:16px;background:var(--us)}
.bubble.them{margin-right:16px;background:var(--them)}
.side{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.meta{color:var(--muted);font-size:12px;margin:4px 0}
.bubble pre{white-space:pre-wrap;font:14px/1.45 -apple-system,system-ui,sans-serif;margin:8px 0 0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin:14px}
.tick{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.tick input{width:20px;height:20px}
.saveflash{color:var(--booked);font-size:13px;min-height:18px;margin:8px 0 0}
.lock{border:0;background:none;color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:28px 8px;text-align:center}
.bubble.note{background:#1a241c;border-color:#2d4a34}
.bubble.note .delnote{display:block;margin-top:8px;padding:0;color:var(--danger)}
.composer{margin-top:12px}

</style>
</head>

<script>

(function () {
  var PASS = "natbooksjake";
  var NOTEKEY = "natalie-live-board-notes-v3";
  var NOTES_PUSH = "https://dweet.cc/dweet/for/jem-natalie-live-nbj-2026";
  var NOTES_PULL = "https://dweet.cc/get/latest/dweet/for/jem-natalie-live-nbj-2026";
  var NOTES_FALLBACK = "call-notes.json";
  var tab = "call";
  var q = "";
  var openId = null;
  var VENUES = [];
  var sharedOk = false;

  function showErr(msg) {
    var el = document.getElementById("err");
    if (el) el.textContent = msg || "";
  }

  function openBoard() {
    document.getElementById("gate").classList.add("ok");
    document.getElementById("app").classList.add("show");
    try { sessionStorage.setItem("natalie-ok", "1"); } catch (e) {}
    renderList();
  }

  function unlock() {
    showErr("");
    var raw = (document.getElementById("pw").value || "").replace(/^\s+|\s+$/g, "");
    var norm = raw.toLowerCase();
    if (norm === PASS || raw === PASS) {
      openBoard();
      return;
    }
    showErr("Wrong password");
  }

  function loadVenues() {
    try {
      var raw = document.getElementById("venues-data").textContent;
      VENUES = JSON.parse(raw);
    } catch (e) {
      VENUES = [];
      showErr("Venue list failed to load");
    }
    fetch("venues.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("venues"); return r.json(); })
      .then(function (data) {
        if (Array.isArray(data) && data.length) {
          VENUES = data;
          if (document.getElementById("app").classList.contains("show") && !openId) renderList();
        }
      })
      .catch(function () {});
  }


  function notes() {
    try { return JSON.parse(localStorage.getItem(NOTEKEY) || "{}"); }
    catch (e) { return {}; }
  }

  function stamp() {
    var el = document.getElementById("sync");
    if (!el) return;
    el.textContent = sharedOk ? "Notes shared with Jake" : "Notes on this phone only";
  }

  function newer(a, b) {
    return String((a && a.updatedAt) || "") > String((b && b.updatedAt) || "");
  }

  function mergeStores(a, b) {
    var out = {};
    var k;
    for (k in a) if (Object.prototype.hasOwnProperty.call(a, k)) out[k] = a[k];
    for (k in b) if (Object.prototype.hasOwnProperty.call(b, k)) {
      if (!out[k] || newer(b[k], out[k])) out[k] = b[k];
    }
    return out;
  }

  function writeLocal(store) {
    localStorage.setItem(NOTEKEY, JSON.stringify(store));
  }

  function saveNotes(store) {
    writeLocal(store);
    pushRemote(store);
  }

  function pullRemote() {
    return fetch(NOTES_PULL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("pull");
        return r.json();
      })
      .then(function (data) {
        var content = data && data.with && data.with[0] && data.with[0].content;
        var raw = content && content.notes;
        var incoming = {};
        if (typeof raw === "string") {
          try { incoming = JSON.parse(raw); } catch (e) { incoming = {}; }
        } else if (raw && typeof raw === "object") {
          incoming = raw;
        }
        var merged = mergeStores(notes(), incoming);
        writeLocal(merged);
        sharedOk = true;
        stamp();
        return merged;
      })
      .catch(function () {
        return fetch(NOTES_FALLBACK + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("file");
          return r.json();
        }).then(function (data) {
          var incoming = (data && data.notes) ? data.notes : (data || {});
          var merged = mergeStores(notes(), incoming);
          writeLocal(merged);
          sharedOk = false;
          stamp();
          return merged;
        });
      })
      .catch(function () {
        sharedOk = false;
        stamp();
        return notes();
      });
  }

  function pushRemote(store) {
    var body = "notes=" + encodeURIComponent(JSON.stringify(store));
    return fetch(NOTES_PUSH, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    }).then(function (r) {
      if (!r.ok) throw new Error("push");
      return r.json();
    }).then(function (data) {
      if (!data || data.this !== "succeeded") throw new Error("push");
      sharedOk = true;
      stamp();
    }).catch(function () {
      sharedOk = false;
      stamp();
    });
  }


  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function badge(v) {
    if (v.tab === "booked" || v.badge === "booked") return "booked";
    if (v.needPhone && !v.phone) return "need number";
    if (v.hasThread) return "replied";
    return v.badge || "open";
  }

  function venueGroup(v) {
    var badge = v.badge || "";
    var name = String(v.name || "").toLowerCase();
    var blob = name + " " + String(v.town || "").toLowerCase();
    if (badge === "bounce" || badge === "declined" || badge === "retract-agency" || badge === "skip-do-not-email") return "skip";
    if (v.tab === "booked" || badge === "booked" || badge === "locked") return "booked";
    if (badge === "quoted" || badge === "replied-interested" || badge === "fully-booked-on-file" || v.hasThread) return "hot";
    if (blob.indexOf("rbl") !== -1 || blob.indexOf("legion") !== -1 || blob.indexOf("rafa") !== -1 || blob.indexOf("ex services") !== -1 || blob.indexOf("naval and military") !== -1) return "rbl";
    if (name.indexOf("cons") !== -1 || blob.indexOf("conservative") !== -1) return "cons";
    if (blob.indexOf("social") !== -1 || blob.indexOf("working men") !== -1 || blob.indexOf("wmc") !== -1 || blob.indexOf("usc") !== -1 || blob.indexOf("club") !== -1) return "social";
    if (blob.indexOf("hotel") !== -1 || blob.indexOf("spa") !== -1 || blob.indexOf("arms") !== -1 || blob.indexOf("tavern") !== -1 || blob.indexOf("inn") !== -1 || blob.indexOf("pub") !== -1 || blob.indexOf("bar") !== -1 || blob.indexOf("jolly") !== -1 || blob.indexOf("plough") !== -1 || blob.indexOf("tavern") !== -1) return "pubs";
    return "other";
  }

  function heat(v) {
    var badge = v.badge || "";
    if (badge === "bounce" || badge === "declined" || badge === "retract-agency" || badge === "skip-do-not-email") return "skip";
    if (v.tab === "booked" || badge === "booked" || badge === "locked") return "booked";
    if (badge === "quoted") return "quoted";
    if (badge === "replied-interested") return "price";
    if (badge === "fully-booked-on-file" || badge === "awaiting" || badge === "queued-2pm-1sep") return "chasing";
    return "other";
  }

  function parseWhen(s) {
    if (!s) return null;
    var n = Date.parse(s);
    if (!isNaN(n)) return new Date(n);
    var m = String(s).match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i);
    if (!m) return null;
    var months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    return new Date(+m[3], months[m[2].slice(0, 3).toLowerCase()], +m[1]);
  }

  function lastDate(v) {
    var msgs = v.messages || [];
    var i;
    for (i = msgs.length - 1; i >= 0; i--) {
      var d = parseWhen(msgs[i].at);
      if (d) return d;
    }
    d = parseWhen(v.replied);
    if (d) return d;
    return parseWhen(v.firstPitch);
  }

  function daysAgo(v) {
    var d = lastDate(v);
    if (!d) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  function daysLabel(v) {
    var n = daysAgo(v);
    if (n == null) return "";
    var replied = String(v.replied || "").toLowerCase().indexOf("yes") === 0 || v.hasThread;
    if (n <= 0) return replied ? "Replied today" : "Pitched today";
    if (replied) return n + "d since reply";
    return n + "d since pitch";
  }

  function telHref(p) {
    var d = String(p || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.charAt(0) === "0") d = "44" + d.slice(1);
    if (d.indexOf("44") !== 0) d = "44" + d;
    return "tel:+" + d;
  }

  function prettyPhone(p) {
    var d = String(p || "").replace(/\D/g, "");
    if (d.indexOf("44") === 0) d = "0" + d.slice(2);
    if (d.length === 11) return d.slice(0, 5) + " " + d.slice(5);
    return p;
  }

  function pepTalk() {
    var store = notes();
    var calledN = 0;
    var k;
    for (k in store) if (store[k] && store[k].called) calledN += 1;
    var quotedN = VENUES.filter(function (v) { return heat(v) === "quoted"; }).length;
    var chaseN = VENUES.filter(function (v) { return heat(v) === "chasing" && v.phone; }).length;
    var bookedN = VENUES.filter(function (v) { return heat(v) === "booked"; }).length;
    if (calledN === 0) return "Four booked already. " + quotedN + " quotes waiting. " + chaseN + " numbers ready. First call is the hardest, Nat.";
    if (calledN < 5) return calledN + " logged on this phone. Keep going — " + chaseN + " still have a number.";
    if (calledN < 15) return calledN + " calls in. That's a shift. Next one's in the list.";
    return calledN + " calls logged. Booked " + bookedN + ". Don't leave a live quote hanging.";
  }


  function inTab(v) {
    if (tab === "all") return true;
    if (tab === "call") return heat(v) !== "booked" && heat(v) !== "skip";
    if (tab === "quoted" || tab === "price" || tab === "chasing" || tab === "booked") return heat(v) === tab;
    return venueGroup(v) === tab;
  }

  function matches(v) {
    if (!q) return true;
    var hay = (v.name + " " + (v.town || "") + " " + (v.email || "") + " " + (v.subject || "")).toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function fmtWhen(iso) {
    if (!iso) return "";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  function nowLocal() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderList() {
    var store = notes();
    var rows = VENUES.filter(function (v) { return inTab(v) && matches(v); });
    rows.sort(function (a, b) {
      var da = daysAgo(a); var db = daysAgo(b);
      if (da == null) da = -1;
      if (db == null) db = -1;
      if (tab === "chasing") return db - da;
      return da - db;
    });
    var groups = ["call","booked","all","quoted","price","chasing","cons","rbl","social","pubs","other","skip"];
    var labels = {call:"Call",booked:"Booked",all:"All",quoted:"Quoted",price:"Price asked",chasing:"Chasing",cons:"Cons",rbl:"RBL",social:"Social",pubs:"Pubs",other:"Other",skip:"Skip"};
    var i;
    for (i = 0; i < groups.length; i++) {
      var g = groups[i];
      var btn = document.getElementById("tab-" + g);
      if (!btn) continue;
      var n = VENUES.filter(function (v) {
        if (g === "all") return true;
        if (g === "call") return heat(v) !== "booked" && heat(v) !== "skip";
        if (g === "quoted" || g === "price" || g === "chasing" || g === "booked") return heat(v) === g;
        return venueGroup(v) === g;
      }).length;
      btn.textContent = labels[g] + " " + n;
      btn.className = tab === g ? "on" : "";
    }
    var pep = document.getElementById("pep");
    if (pep) pep.textContent = pepTalk();
    document.getElementById("count").textContent = rows.length + " venues · " + (labels[tab] || tab);
    document.getElementById("list").innerHTML = rows.map(function (v) {
      var n = store[v.id] || {};
      var b = badge(v);
      var h = heat(v);
      var thread = v.messages || [];
      var last = thread.length ? thread[thread.length - 1] : null;
      var snippet = last && last.body ? last.body.slice(0, 140) : (v.subject || "");
      var days = daysLabel(v);
      var daysClass = (daysAgo(v) != null && daysAgo(v) >= 7) ? "stale" : "fresh";
      var heatBadge = h === "quoted" ? "quoted" : h === "price" ? "price" : h === "chasing" ? "chasing" : (b === "booked" ? "booked" : "");
      var heatText = h === "quoted" ? "quoted" : h === "price" ? "price asked" : h === "chasing" ? "chasing" : b;
      return '<article class="card' + (h === "quoted" || h === "price" ? " hotcard" : "") + '">' +
        '<div class="cardtop"><div><h2>' + esc(v.name) + '</h2>' +
        (v.town ? '<p class="town">' + esc(v.town) + '</p>' : '') +
        '</div><span class="badge ' + heatBadge + '">' + esc(heatText) + '</span></div>' +
        (v.phone
          ? '<a class="callbtn" href="' + telHref(v.phone) + '">Call ' + esc(prettyPhone(v.phone)) + '</a>'
          : '<p class="need">Need a public number</p>') +
        (days ? '<p class="days ' + daysClass + '">' + esc(days) + '</p>' : '') +
        (v.email ? '<p class="email">' + esc(v.email) + '</p>' : '') +
        (v.replied ? '<p class="replied">Replied · ' + esc(v.replied) + '</p>' : '') +
        (n.called ? '<p class="calledtag">Called' + (n.calledAt ? ' · ' + esc(n.calledAt) : '') + '</p>' : '') +
        (lastNoteText(n) ? '<p class="snippet">Note · ' + esc(lastNoteText(n).slice(0, 140)) + '</p>' : (snippet ? '<p class="snippet">' + esc(snippet) + '</p>' : '')) +
        '<button class="openbtn" type="button" data-open="' + esc(v.id) + '">View conversation</button>' +
      '</article>';
    }).join("") || '<p class="empty">Nothing in this tab</p>';
  }

  function lastNoteText(n) {
    if (n && Array.isArray(n.entries) && n.entries.length) {
      return n.entries[n.entries.length - 1].text || "";
    }
    return (n && n.note) || "";
  }

  function recordOf(id) {
    var n = notes()[id] || {};
    var entries = Array.isArray(n.entries) ? n.entries.slice() : [];
    if (!entries.length && n.note) {
      entries.push({ at: n.updatedAt || n.calledAt || "", text: n.note, called: !!n.called });
    }
    return {
      venueId: id,
      called: !!n.called,
      calledAt: n.calledAt || null,
      note: n.note || "",
      updatedAt: n.updatedAt || null,
      entries: entries
    };
  }

  function renderDetail(id) {
    var v = null;
    for (var i = 0; i < VENUES.length; i++) if (VENUES[i].id === id) v = VENUES[i];
    if (!v) return;
    var rec = recordOf(id);
    var thread = v.messages || [];
    var when = rec.calledAt ? String(rec.calledAt).slice(0, 16) : "";
    document.getElementById("app").classList.remove("show");
    var d = document.getElementById("detail");
    d.className = "show";
    var bubbles = thread.length
      ? thread.map(function (m, i) {
          return '<div class="bubble ' + (m.side === "them" ? "them" : "us") + '">' +
            '<div class="side">' + (m.side === "them" ? "THEM · venue" : "US · Natalie / Jake") + " · " + (i + 1) + "/" + thread.length + "</div>" +
            '<p class="meta">' + esc(m.label || "") + (m.at ? " · " + esc(fmtWhen(m.at)) : "") + "</p>" +
            (m.from ? '<p class="meta">' + esc(m.from) + "</p>" : "") +
            (m.subject ? '<p class="replied">' + esc(m.subject) + "</p>" : "") +
            "<pre>" + esc(m.body || "") + "</pre></div>";
        }).join("")
      : '<p class="replied">No reply yet</p><p class="email">Pitch is on file. No inbound venue reply in this thread.</p>';
    var noteBlocks = rec.entries.length
      ? rec.entries.map(function (entry, i) {
          return '<div class="bubble note">' +
            '<div class="side">Note · ' + (i + 1) + "/" + rec.entries.length + "</div>" +
            '<p class="meta">' + esc(fmtWhen(entry.at) || "just now") + (entry.called ? " · called" : "") + "</p>" +
            "<pre>" + esc(entry.text || "") + "</pre>" +
            '<button class="lock delnote" type="button" data-del="' + i + '">Delete note</button></div>';
        }).join("")
      : '<p class="email">No notes yet. Write one below and tap Save note.</p>';
    d.innerHTML =
      "<header><button class='back' id='back' type='button'>Back to list</button>" +
      "<h1>" + esc(v.name) + "</h1>" +
      (v.town ? '<p class="town">' + esc(v.town) + "</p>" : "") +
      "</header>" +
      '<div class="panel" style="margin-top:14px">' +
        (v.phone ? '<a class="callbtn" href="' + telHref(v.phone) + '">Call ' + esc(prettyPhone(v.phone)) + "</a>" : '<p class="need">No public number on file</p>') +
        (v.email ? '<p class="email">' + esc(v.email) + "</p>" : "") +
        '<p class="meta">Status · ' + esc(badge(v)) + "</p>" +
        (v.replied ? '<p class="replied">Replied · ' + esc(v.replied) + "</p>" : "") +
        (v.firstPitch ? '<p class="meta">First pitch · ' + esc(v.firstPitch) + "</p>" : "") +
      "</div>" +
      '<div class="panel"><p class="kicker">Conversation</p>' + bubbles +
      '<p class="kicker" style="margin-top:18px">Notes</p>' + noteBlocks +
      '<div class="composer">' +
        '<label class="tick"><input id="called" type="checkbox"' + (rec.called ? " checked" : "") + "/> Called</label>" +
        '<label class="meta" for="when">When</label>' +
        '<input id="when" type="datetime-local" value="' + esc(when) + '"/>' +
        '<label class="meta" for="note">Add a note</label>' +
        '<textarea id="note" rows="4" placeholder="Left voicemail / spoke to the manager / call back Friday"></textarea>' +
        '<button class="primary" id="save" type="button">Save note</button>' +
        '<p class="saveflash" id="flash"></p>' +
      "</div></div>";
    document.getElementById("back").onclick = function () {
      d.className = "";
      document.getElementById("app").classList.add("show");
      openId = null;
      renderList();
    };
    document.getElementById("called").onchange = function (e) {
      if (e.target.checked && !document.getElementById("when").value) {
        document.getElementById("when").value = nowLocal();
      }
    };
    document.getElementById("save").onclick = function () {
      var text = (document.getElementById("note").value || "").replace(/^\s+|\s+$/g, "");
      var called = document.getElementById("called").checked;
      var calledAt = document.getElementById("when").value || null;
      if (!text && !called) {
        document.getElementById("flash").textContent = "Type a note first";
        return;
      }
      var store2 = notes();
      var rec2 = recordOf(id);
      rec2.entries.push({
        at: new Date().toISOString(),
        text: text || (called ? "Called" : ""),
        called: called
      });
      store2[id] = {
        venueId: id,
        called: called,
        calledAt: calledAt,
        note: text || rec2.note,
        updatedAt: new Date().toISOString(),
        entries: rec2.entries
      };
      saveNotes(store2);
      renderDetail(id);
      var flash = document.getElementById("flash");
      if (flash) flash.textContent = "Note added under the emails";
    };
    d.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute("data-del"), 10);
        var store2 = notes();
        var rec2 = recordOf(id);
        rec2.entries.splice(idx, 1);
        store2[id] = {
          venueId: id,
          called: rec2.called,
          calledAt: rec2.calledAt,
          note: rec2.entries.length ? rec2.entries[rec2.entries.length - 1].text : "",
          updatedAt: new Date().toISOString(),
          entries: rec2.entries
        };
        saveNotes(store2);
        renderDetail(id);
      };
    });
  }

  loadVenues();
  stamp();
  try {
    var wipe = notes();
    if (wipe["broomfield-rbl"]) {
      delete wipe["broomfield-rbl"];
      writeLocal(wipe);
    }
  } catch (e) {}
  pullRemote().then(function () { if (document.getElementById("app").classList.contains("show")) renderList(); });
  setInterval(function () {
    if (!document.getElementById("app").classList.contains("show")) return;
    pullRemote().then(function () { if (!openId) renderList(); });
  }, 20000);
  setInterval(function () {
    if (!document.getElementById("app").classList.contains("show")) return;
    loadVenues();
  }, 60000);
  document.getElementById("go").onclick = unlock;
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlock();
  });
  document.getElementById("q").addEventListener("input", function (e) {
    q = e.target.value;
    renderList();
  });
  document.getElementById("tabs").addEventListener("click", onTab);
  document.getElementById("tabs-main").addEventListener("click", onTab);
  document.getElementById("tabs-heat").addEventListener("click", onTab);
  function onTab(e) {
    var btn = e.target.closest("[data-tab]");
    if (!btn) return;
    tab = btn.getAttribute("data-tab");
    renderList();
  }
  document.getElementById("lock").onclick = function () {
    try { sessionStorage.removeItem("natalie-ok"); } catch (e) {}
    location.reload();
  };
  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-open]");
    if (!btn) return;
    openId = btn.getAttribute("data-open");
    renderDetail(openId);
  });
  try {
    if (sessionStorage.getItem("natalie-ok") === "1") openBoard();
  } catch (e) {}
})();

</script>
</body>
</html>
